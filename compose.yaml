services:
  neuron404:
    image: neuron404
    container_name: neuron404
    build: .
    environment:
      NEURON404_AUTH_TOKEN: ${NEURON404_AUTH_TOKEN:-}
      NEURON404_READ_TOKEN: ${NEURON404_READ_TOKEN:-}
      NEURON404_PUBLIC_URL: ${NEURON404_PUBLIC_URL:-}
      PROTOCOL_HEADER: x-forwarded-proto
      BODY_SIZE_LIMIT: 1M
    restart: unless-stopped
    init: true
    user: '${NEURON404_UID:-1000}:${NEURON404_GID:-1000}'
    ports:
      - '127.0.0.1:${NEURON404_PORT:-3000}:3000'
    volumes:
      - type: bind
        source: ${HOME}/.neuron404
        target: /data
        bind:
          create_host_path: false
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    stop_grace_period: 30s
